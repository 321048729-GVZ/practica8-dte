name: Verificar DTE

on:
  push:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar mi_sistema/estados.py
        run: python verificar.py mi_sistema/estados.py
